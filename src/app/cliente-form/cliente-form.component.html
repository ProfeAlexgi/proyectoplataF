<div class="form-container">
  <div class="glass-panel">
    <div *ngIf="!successMessage" class="form-wrapper">
      <div class="header">
        <h2>Registro de Cliente</h2>
        <p>Complete los datos para guardar al cliente</p>
      </div>

      <form [formGroup]="clienteForm" (ngSubmit)="onSubmit()">
        <div class="form-grid">
          <div class="input-group">
            <label>Nombre</label>
            <input type="text" formControlName="nombre" placeholder="Nombre" [class.invalid]="clienteForm.get('nombre')?.invalid && clienteForm.get('nombre')?.touched">
          </div>
          
          <div class="input-group">
            <label>Apellido</label>
            <input type="text" formControlName="apellido" placeholder="Apellido" [class.invalid]="clienteForm.get('apellido')?.invalid && clienteForm.get('apellido')?.touched">
          </div>

          <div class="input-group">
            <label>Cédula</label>
            <input type="text" formControlName="cedula" placeholder="Documento" [class.invalid]="clienteForm.get('cedula')?.invalid && clienteForm.get('cedula')?.touched">
          </div>

          <div class="input-group">
            <label>Email</label>
            <input type="email" formControlName="email" placeholder="correo@ejemplo.com" [class.invalid]="clienteForm.get('email')?.invalid && clienteForm.get('email')?.touched">
          </div>

          <div class="input-group">
            <label>Teléfono</label>
            <input type="tel" formControlName="telefono" placeholder="Número" [class.invalid]="clienteForm.get('telefono')?.invalid && clienteForm.get('telefono')?.touched">
          </div>

          <div class="input-group">
            <label>Sexo</label>
            <select formControlName="sexo" [class.invalid]="clienteForm.get('sexo')?.invalid && clienteForm.get('sexo')?.touched">
              <option value="" disabled selected>Seleccione</option>
              <option value="M">Masculino</option>
              <option value="F">Femenino</option>
              <option value="O">Otro</option>
            </select>
          </div>

          <div class="input-group full-width">
            <label>Dirección</label>
            <input type="text" formControlName="direccion" placeholder="Dirección completa" [class.invalid]="clienteForm.get('direccion')?.invalid && clienteForm.get('direccion')?.touched">
          </div>

          <div class="input-group">
            <label>Fecha de Nacimiento</label>
            <input type="date" formControlName="fechaNacimiento" [class.invalid]="clienteForm.get('fechaNacimiento')?.invalid && clienteForm.get('fechaNacimiento')?.touched">
          </div>
        </div>

        <div class="actions">
          <button type="submit" [disabled]="isSubmitting" class="submit-btn">
            <span *ngIf="!isSubmitting">Guardar Cliente</span>
            <span *ngIf="isSubmitting" class="loader"></span>
          </button>
          <button type="button" class="logout-btn" (click)="onLogout()">Volver</button>
        </div>
      </form>
    </div>

    <div *ngIf="successMessage" class="success-wrapper">
      <div class="success-icon">✓</div>
      <h2>¡Cliente Guardado!</h2>
      <p>Los datos se han registrado correctamente en MySQL.</p>
      
      <div class="actions">
        <button class="submit-btn" (click)="onReset()">Registrar Otro Cliente</button>
        <button class="logout-btn" (click)="onLogout()">Cerrar Sesión</button>
      </div>
    </div>
  </div>
</div>
